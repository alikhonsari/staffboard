name: StaffBoard Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate static interface scripts
        run: |
          node --check public/share-png-safe.js
          node --check public/share-png-float.js
          node --check public/sidebar-v3.js
          node --check public/theme-preload-v3.js
          node --check public/theme-controller-v3.js
          node --check public/builder-management-v3.js
      - name: Validate Dark Mode v3 assets
        run: |
          test -s public/dark-mode-v3.css
          grep -q -- '--dark-surface-1' public/dark-mode-v3.css
          grep -q 'staffboard.theme.' public/theme-controller-v3.js
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('index.html', 'utf8')
          const preload = html.indexOf('/theme-preload-v3.js')
          const firstCss = html.indexOf('<link rel="stylesheet"')
          const sidebarCss = html.indexOf('/sidebar-v3.css')
          const darkCss = html.indexOf('/dark-mode-v3.css')
          const controller = html.indexOf('/theme-controller-v3.js')
          if (preload < 0 || firstCss < 0 || preload > firstCss) throw new Error('Theme preload must load before stylesheets')
          if (darkCss < 0 || darkCss < sidebarCss) throw new Error('Dark Mode v3 CSS must load after Sidebar v3 CSS')
          if (controller < 0) throw new Error('Theme controller is missing from index.html')
          NODE
      - name: Validate Builder Management v3 assets
        run: |
          test -s src/BuilderManagementWorkspace.jsx
          test -s src/BuilderHealthInsights.jsx
          test -s public/builder-management-v3.css
          test -s public/builder-management-v3.js
          grep -q 'data-builder-management-v3' src/BuilderManagementWorkspace.jsx
          grep -q 'Archived Builders' src/BuilderManagementWorkspace.jsx
          grep -q 'Quick Add Builders' src/BuilderManagementWorkspace.jsx
          grep -q 'Historical staffing, hours, reports' src/BuilderManagementWorkspace.jsx
          grep -q 'builderManagementVersion' builder-management-v3-plugin.js
          grep -q 'Builder Management v3' builder-management-v3-validation-plugin.js
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('index.html', 'utf8')
          const darkCss = html.indexOf('/dark-mode-v3.css')
          const builderCss = html.indexOf('/builder-management-v3.css')
          const builderScript = html.indexOf('/builder-management-v3.js')
          if (builderCss < 0 || builderCss < darkCss) throw new Error('Builder Management CSS must load after Dark Mode v3 CSS')
          if (builderScript < 0) throw new Error('Builder Management controller is missing from index.html')
          NODE
      - name: Validate Daily PDF v3 assets and fixtures
        run: |
          test -s src/DailyPdfReportV3.jsx
          test -s src/dailyPdfExportV3.js
          test -s src/dailyPdfLayoutV3.js
          test -s public/daily-pdf-v3.css
          grep -q 'data-daily-pdf-page' src/DailyPdfReportV3.jsx
          grep -q 'Page {pageNumber} of {pageCount}' src/DailyPdfReportV3.jsx
          grep -q 'No production data recorded' src/DailyPdfReportV3.jsx
          grep -q 'No staffed areas or area hours recorded' src/DailyPdfReportV3.jsx
          grep -q 'orientation: .landscape.' src/dailyPdfExportV3.js
          grep -q 'exportDailyPdfV3' daily-pdf-v3-plugin.js
          grep -q 'legacy tall-canvas slicing exporter' daily-pdf-v3-validation-plugin.js
          grep -q 'table-layout:fixed' public/daily-pdf-v3.css
          grep -q 'width:100%' public/daily-pdf-v3.css
          node --input-type=module <<'NODE'
          import { runDailyPdfFixtureChecks } from './src/dailyPdfLayoutV3.js'
          const result = runDailyPdfFixtureChecks()
          if (result.empty !== 1) throw new Error('Empty Daily PDF fixture must be one page')
          console.log('Daily PDF fixture pages:', result)
          NODE
          node <<'NODE'
          const fs = require('fs')
          const html = fs.readFileSync('index.html', 'utf8')
          const builderCss = html.indexOf('/builder-management-v3.css')
          const pdfCss = html.indexOf('/daily-pdf-v3.css')
          if (pdfCss < 0 || pdfCss < builderCss) throw new Error('Daily PDF v3 CSS must load last')
          const component = fs.readFileSync('src/DailyPdfReportV3.jsx', 'utf8')
          if (component.includes('className="pdf-report-sheet"')) throw new Error('Daily PDF v3 must not use the legacy fixed-width sheet')
          const exporter = fs.readFileSync('src/dailyPdfExportV3.js', 'utf8')
          if (!exporter.includes("querySelectorAll('[data-daily-pdf-page]')")) throw new Error('Daily PDF exporter must capture explicit pages')
          NODE
      - name: Install dependencies
        run: npm install
      - name: Lint StaffBoard
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.log
      - name: Test StaffBoard
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Build StaffBoard
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.log
      - name: Upload transform diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staffboard-build-diagnostics
          path: |
            speed-lite-transform-status.json
            daily-pdf-v3-transform-status.json
            dist/transform-diagnostics.json
            lint-output.log
            test-output.log
            build-output.log
          if-no-files-found: ignore
