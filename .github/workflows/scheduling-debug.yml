name: Scheduling Test Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run scheduling tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee scheduling-test-output.log
      - name: Upload scheduling diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduling-test-diagnostics
          path: scheduling-test-output.log
          if-no-files-found: error
